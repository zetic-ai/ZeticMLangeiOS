name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile release tooling
        run: python3 -m py_compile scripts/public_spm_release.py
      - name: Run release tooling tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
